name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/api-key-env-3mhukn]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Deploy στο gh-pages branch: το GitHub ενεργοποιεί Pages αυτόματα
      # για branch με αυτό το όνομα (δεν θέλει admin token όπως το
      # actions/configure-pages enablement).
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          exclude_assets: ".github,scripts"
