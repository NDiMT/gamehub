<!doctype html>
<html lang="el"><head><meta charset="utf-8">

</head><body>
<canvas id="c" aria-label="Παιχνίδι: άγγιξε τα σύννεφα για κεραυνό, κράτα πατημένο για μεγάλο κεραυνό"></canvas><canvas id="paper"></canvas>
<script>
let W=1920,H=1080;const OL='#3a302a';
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),pc=document.getElementById('paper');
// ---------- helpers ----------
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), prog=(t,a,b)=>clamp((t-a)/(b-a)), lerp=(a,b,x)=>a+(b-a)*x;
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2, eout=x=>1-Math.pow(1-x,3), bump=(t,a,b)=>Math.sin(Math.PI*prog(t,a,b));
const ebk=x=>{const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);};
const jump=(t,a,b,h)=>t>a&&t<b?Math.sin(Math.PI*prog(t,a,b))*h:0;
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hex(c){return [parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];}
function mix(a,b,k){const A=hex(a),B=hex(b);return `rgb(${A.map((v,i)=>Math.round(lerp(v,B[i],k))).join(',')})`;}
// ---------- hand-drawn look: pencil lines + coloured-pencil texture ----------
const PENCIL='#3a302a';
const grain=(()=>{const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');const R=rng(77);
  x.strokeStyle='rgba(40,30,20,1)';x.lineCap='round';
  for(let i=0;i<260;i++){const px=R()*180,py=R()*180,l=6+R()*14;x.globalAlpha=.12+R()*.3;x.lineWidth=.8+R()*1.4;x.beginPath();x.moveTo(px,py);x.lineTo(px+l*.8,py-l*.6);x.stroke();}
  return ctx.createPattern(c,'repeat');})();
let pCount=0;
function P(fn,fill,lw=10,stroke=true){
  pCount++;
  if(fill){const R=rng(pCount*13+1);ctx.save();ctx.translate((R()-.5)*5,(R()-.5)*5);ctx.beginPath();fn();ctx.fillStyle=fill;ctx.fill();
    ctx.globalCompositeOperation='multiply';ctx.globalAlpha=.55;ctx.fillStyle=grain;ctx.fill();ctx.restore();}
  if(stroke){ctx.save();ctx.beginPath();fn();ctx.strokeStyle=PENCIL;ctx.lineWidth=Math.max(2,lw*.62);ctx.stroke();
    ctx.translate(1.6,-1.2);ctx.beginPath();fn();ctx.globalAlpha=.4;ctx.lineWidth=Math.max(1.2,lw*.28);ctx.stroke();ctx.restore();}
}
function tube(x1,y1,x2,y2,w,col,lw=8){ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle=PENCIL;ctx.lineWidth=w+lw*1.3;ctx.stroke();
  ctx.strokeStyle=col;ctx.lineWidth=w;ctx.stroke();ctx.save();ctx.globalCompositeOperation='multiply';ctx.globalAlpha=.5;ctx.strokeStyle=grain;ctx.stroke();ctx.restore();}
function impact(x,y,r,k,col='#ffd83a',seed=1){if(k<=0||k>=1)return;const sc=k<.25?ebk(k/.25):1;ctx.save();ctx.globalAlpha=k>.7?1-(k-.7)/.3:1;ctx.translate(x,y);ctx.scale(sc,sc);
  const R=rng(seed),n=14,pts=[],pts2=[];for(let i=0;i<n*2;i++){const a=i*Math.PI/n,rr=i%2?r*.5:r*(.8+R()*.4);pts.push([Math.cos(a)*rr,Math.sin(a)*rr]);pts2.push([Math.cos(a)*rr*.55,Math.sin(a)*rr*.55]);}
  P(poly(pts),col,10);P(poly(pts2),'#fffbe6',6);ctx.restore();}
function bubbleIcon(x,y,tx,ty,k,icon){if(k<=0||k>=1)return;const sc=k<.15?ebk(k/.15):1;ctx.save();ctx.globalAlpha=k>.88?1-(k-.88)/.12:1;ctx.translate(x,y);ctx.scale(sc,sc);
  P(()=>{ctx.moveTo(-18,50);ctx.lineTo(tx-x,ty-y);ctx.lineTo(22,50);},'#fffdf7',7);P(E(0,0,95,68),'#fffdf7',8);
  if(icon==='bolt') P(poly([[-10,-48],[30,-48],[8,-8],[34,-8],[-22,52],[-4,4],[-30,4]]),'#ffd83a',7);
  else if(icon==='heart'){P(()=>{ctx.moveTo(0,40);ctx.bezierCurveTo(-70,-5,-40,-60,0,-24);ctx.bezierCurveTo(40,-60,70,-5,0,40);},'#ff6f7d',7);}
  else if(icon==='laugh'){for(let i=0;i<3;i++)P(()=>{ctx.arc(-40+i*40,-5,16,0,Math.PI);},null,7);}
  ctx.restore();}
function motionLines(x,y,r,k,seed){if(k<=0||k>=1)return;const R=rng(seed);ctx.save();ctx.globalAlpha=1-k;ctx.strokeStyle=PENCIL;ctx.lineWidth=5;
  for(let i=0;i<8;i++){const a=R()*6.28,d=r*(1+k*.6);ctx.beginPath();ctx.moveTo(x+Math.cos(a)*d,y+Math.sin(a)*d);ctx.lineTo(x+Math.cos(a)*(d+40),y+Math.sin(a)*(d+40));ctx.stroke();}ctx.restore();}
const E=(x,y,rx,ry,r=0)=>()=>ctx.ellipse(x,y,rx,ry,r,0,Math.PI*2);
const C=(x,y,r)=>E(x,y,r,r);
function poly(pts,close=true){return()=>{ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);if(close)ctx.closePath();};}
ctx.lineJoin='round';ctx.lineCap='round';

// ---------- the boy (drawn from the photos) ----------
const SKIN='#e9bb97',SKIND='#cf9a76',SHIRT='#a4b3cc',DENIM='#afc7df',HAIR='#553823',HAIRL='#7b5436',SHOEG='#1f5a3c';const KS=.75,PS=.72;
function kid(x,y,s,o={}){
  const {armL=.1,armR=.1,legL=.03,legR=.03,expr='smile',look=[0,0],blink=0,squash=0,tilt=0}=o;
  ctx.save();ctx.translate(x,y);ctx.scale(s*(1+squash*.06),s*(1-squash*.06));ctx.rotate(tilt);
  ctx.fillStyle='rgba(60,40,30,.16)';ctx.beginPath();ctx.ellipse(0,0,120,16,0,0,7);ctx.fill();
  if(o.air){ctx.translate(0,-o.air/s);}
  // legs, socks, high-top sneakers
  for(const [sd,a] of [[-1,legL],[1,legR]]){const hx=sd*34,hy=-330,ex=hx+sd*Math.sin(a)*270,ey=hy+Math.cos(a)*270;
    tube(hx,hy,ex,ey,31,SKIN,6); tube(ex-sd*Math.sin(a)*22,ey-22,ex,ey,35,'#f4f2ee',6);
    ctx.save();ctx.translate(ex+sd*3,ey+30);ctx.rotate(sd*a*.5);
    P(()=>{ctx.moveTo(-27,-44);ctx.lineTo(27,-44);ctx.lineTo(33,-2);ctx.quadraticCurveTo(46,24,0,28);ctx.quadraticCurveTo(-46,24,-33,-2);ctx.closePath();},'#fbfaf6',8);
    P(()=>ctx.roundRect(-28,-48,56,12,5),SHOEG,6);
    for(let i=0;i<3;i++)P(poly([[sd*(6+i*8),-32],[sd*(12+i*8),-32],[sd*(22+i*8),8],[sd*(16+i*8),8]]),SHOEG,3);
    P(()=>{ctx.moveTo(-42,17);ctx.quadraticCurveTo(0,24,42,17);},null,6);
    for(let i=0;i<3;i++)P(()=>{ctx.moveTo(-9,-30+i*9);ctx.lineTo(9,-26+i*9);},null,4);
    ctx.restore();}
  // long, loose denim shorts
  P(()=>{ctx.moveTo(-80,-412);ctx.lineTo(80,-412);ctx.quadraticCurveTo(92,-300,96,-186);ctx.lineTo(8,-182);ctx.lineTo(0,-296);ctx.lineTo(-8,-182);ctx.lineTo(-96,-186);ctx.quadraticCurveTo(-92,-300,-80,-412);ctx.closePath();},DENIM,9);
  P(()=>{ctx.moveTo(0,-408);ctx.lineTo(0,-300);ctx.moveTo(-70,-400);ctx.quadraticCurveTo(-50,-370,-72,-340);ctx.moveTo(70,-400);ctx.quadraticCurveTo(50,-370,72,-340);},null,4);
  ctx.strokeStyle='#e8f0f8';ctx.lineWidth=3;for(let i=0;i<9;i++){for(const sd of [-1,1]){const xx=sd*(14+i*9);ctx.beginPath();ctx.moveTo(xx,-188);ctx.lineTo(xx+sd*2,-178);ctx.stroke();}}
  // neck, arms
  P(()=>ctx.roundRect(-19,-590,38,40,8),SKIN,7);
  const hands=[],arms=[[-1,armL],[1,armR]];
  for(const [sd,a] of arms){const sx=sd*72,sy=-538,ex=sx+sd*Math.sin(a)*205,ey=sy+Math.cos(a)*205;tube(sx,sy,ex,ey,27,SKIN,6);hands.push([ex,ey,sd,a]);}
  // t-shirt with chest pocket
  P(()=>{ctx.moveTo(-80,-552);ctx.lineTo(-30,-568);ctx.quadraticCurveTo(0,-548,30,-568);ctx.lineTo(80,-552);ctx.quadraticCurveTo(92,-470,90,-384);ctx.quadraticCurveTo(0,-374,-90,-384);ctx.quadraticCurveTo(-92,-470,-80,-552);ctx.closePath();},SHIRT,9);
  P(()=>{ctx.moveTo(-30,-566);ctx.quadraticCurveTo(0,-540,30,-566);ctx.moveTo(-26,-560);ctx.quadraticCurveTo(0,-532,26,-560);},null,4);
  P(()=>{ctx.moveTo(18,-522);ctx.lineTo(62,-522);ctx.lineTo(62,-482);ctx.quadraticCurveTo(40,-476,18,-482);ctx.closePath();},SHIRT,5);
  for(const [hx,hy,sd,a] of hands){ctx.save();ctx.translate(sd*70,-542);ctx.rotate(-sd*a);ctx.scale(sd,1);
    P(poly([[-24,-8],[20,-14],[30,58],[-14,64]]),SHIRT,8);P(()=>{ctx.moveTo(-12,58);ctx.lineTo(28,52);},null,3);ctx.restore();}
  for(const [hx,hy,sd,a] of hands){P(E(hx,hy+4,19,23),SKIN,6);P(()=>{ctx.moveTo(hx-sd*8,hy-6);ctx.lineTo(hx-sd*16,hy+10);},null,3);}
  // head
  ctx.save();ctx.translate(0,-676);ctx.rotate(o.headTilt||0);ctx.scale(1.2,1.2);
  for(const sd of [-1,1]){P(E(sd*84,6,15,24),SKIN,6);P(()=>{ctx.moveTo(sd*80,-6);ctx.quadraticCurveTo(sd*90,6,sd*82,20);},null,3);}
  const face=()=>{ctx.moveTo(-86,-10);ctx.bezierCurveTo(-88,-82,-50,-104,0,-104);ctx.bezierCurveTo(50,-104,88,-82,86,-10);ctx.bezierCurveTo(86,52,56,90,0,96);ctx.bezierCurveTo(-56,90,-86,52,-86,-10);ctx.closePath();};
  P(face,SKIN,8);
  ctx.save();ctx.beginPath();face();ctx.clip();ctx.strokeStyle=SKIND;ctx.globalAlpha=.5;ctx.lineWidth=2.5;
  for(let i=0;i<14;i++){ctx.beginPath();ctx.moveTo(52+i*3,-40+i*9);ctx.lineTo(92,-60+i*9);ctx.stroke();}ctx.restore();
  ctx.fillStyle='rgba(235,120,105,.28)';for(const sd of [-1,1]){ctx.beginPath();ctx.ellipse(sd*50,40,20,11,0,0,7);ctx.fill();}
  // thick brown hair with a fringe falling on the forehead
  P(()=>{ctx.moveTo(-90,6);ctx.quadraticCurveTo(-112,-50,-96,-92);ctx.quadraticCurveTo(-96,-120,-70,-132);ctx.lineTo(-66,-150);ctx.lineTo(-44,-140);ctx.quadraticCurveTo(-30,-162,-8,-150);ctx.lineTo(4,-166);ctx.lineTo(18,-148);
    ctx.quadraticCurveTo(44,-160,60,-140);ctx.lineTo(80,-146);ctx.lineTo(78,-124);ctx.quadraticCurveTo(104,-104,104,-70);ctx.quadraticCurveTo(110,-30,92,6);ctx.lineTo(86,-30);
    ctx.lineTo(76,-44);ctx.lineTo(68,-30);ctx.lineTo(58,-52);ctx.lineTo(44,-34);ctx.lineTo(34,-58);ctx.lineTo(18,-36);ctx.lineTo(8,-60);ctx.lineTo(-8,-38);ctx.lineTo(-18,-62);ctx.lineTo(-36,-40);ctx.lineTo(-46,-62);ctx.lineTo(-62,-42);ctx.lineTo(-72,-56);ctx.lineTo(-86,-28);ctx.closePath();},HAIR,8);
  ctx.strokeStyle=HAIRL;ctx.lineWidth=4;for(const [a,b,c,d,e,f] of [[-60,-110,-40,-90,-30,-66],[-20,-128,0,-100,4,-72],[20,-128,34,-100,36,-68],[56,-112,66,-86,62,-60],[-80,-70,-76,-50,-70,-42]]){ctx.beginPath();ctx.moveTo(a,b);ctx.quadraticCurveTo(c,d,e,f);ctx.stroke();}
  ctx.strokeStyle='rgba(255,230,200,.35)';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(-40,-120);ctx.quadraticCurveTo(0,-132,36,-122);ctx.stroke();
  // brows
  const bup=expr==='wow'?-10:0;
  for(const sd of [-1,1]){const inner=expr==='sad'?-8:expr==='angry'?8:0;
    P(()=>{ctx.moveTo(sd*12,-22+inner+bup);ctx.quadraticCurveTo(sd*34,-34+bup,sd*58,-28+bup);ctx.lineTo(sd*56,-22+bup);ctx.quadraticCurveTo(sd*34,-27+bup,sd*13,-14+inner+bup);ctx.closePath();},HAIR,3);}
  // almond eyes, dark brown
  for(const sd of [-1,1]){const ex=sd*34,ey=4;
    if(blink>.5){P(()=>{ctx.moveTo(ex-21,ey);ctx.quadraticCurveTo(ex,ey+(expr==='grin'?-8:8),ex+21,ey);},null,6);continue;}
    const eye=()=>{ctx.moveTo(ex-21,ey+2);ctx.bezierCurveTo(ex-18,ey-22,ex+18,ey-22,ex+21,ey+1);ctx.bezierCurveTo(ex+18,ey+19,ex-18,ey+19,ex-21,ey+2);ctx.closePath();};
    P(eye,'#fdfbf6',3);ctx.save();ctx.beginPath();eye();ctx.clip();
    ctx.fillStyle='#3a2212';ctx.beginPath();ctx.arc(ex+look[0]*6,ey+1+look[1]*4,13.5,0,7);ctx.fill();
    ctx.fillStyle='#120a05';ctx.beginPath();ctx.arc(ex+look[0]*6,ey+1+look[1]*4,6.5,0,7);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ex+look[0]*6+4.5,ey-4+look[1]*4,4,0,7);ctx.fill();ctx.beginPath();ctx.arc(ex+look[0]*6-4,ey+6+look[1]*4,1.8,0,7);ctx.fill();ctx.restore();
    P(()=>{ctx.moveTo(ex-21,ey+2);ctx.bezierCurveTo(ex-18,ey-22,ex+18,ey-22,ex+21,ey+1);},null,5);
    P(()=>{ctx.moveTo(ex+sd*20,ey-5);ctx.lineTo(ex+sd*27,ey-10);},null,3.5);}
  // nose
  P(()=>{ctx.moveTo(-3,18);ctx.quadraticCurveTo(-7,30,-3,35);ctx.moveTo(-9,38);ctx.quadraticCurveTo(0,44,9,38);},null,3.2);
  // mouth
  if(expr==='smile'){P(()=>{ctx.moveTo(-20,57);ctx.quadraticCurveTo(0,70,20,57);},null,4.5);
    ctx.strokeStyle='rgba(190,110,100,.55)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-10,66);ctx.quadraticCurveTo(0,70,10,66);ctx.stroke();}
  else if(expr==='sad') P(()=>{ctx.moveTo(-18,64);ctx.quadraticCurveTo(0,54,18,64);},null,4.5);
  else if(expr==='angry') P(()=>{ctx.moveTo(-18,60);ctx.lineTo(18,58);},null,4.5);
  else if(expr==='wow') P(E(0,62,11,15),'#6a2424',4);
  else {const h=expr==='shout'?44:30;
    P(()=>{ctx.moveTo(-28,52);ctx.quadraticCurveTo(0,54,28,52);ctx.quadraticCurveTo(0,52+h,-28,52);ctx.closePath();},'#7e2828',4.5);
    ctx.save();ctx.clip();ctx.fillStyle='#fff';ctx.fillRect(-28,50,56,9);ctx.fillStyle='#e8858e';ctx.beginPath();ctx.ellipse(0,52+h*.8,16,10,0,0,7);ctx.fill();ctx.restore();}
  ctx.restore();ctx.restore();
}
// ---------- Pikachu ----------
const YEL='#ffd733',RED='#e8402f',BRN='#8a5a2b';
function pika(x,y,s,o={}){
  const {expr='w',blink=0,glow=0,ears=0,arms='down',squash=0,flip=1,angry=0,tilt=0}=o;
  ctx.save();ctx.translate(x,y);
  ctx.fillStyle='rgba(0,0,0,.18)';ctx.beginPath();ctx.ellipse(0,0,95*s,15*s,0,0,7);ctx.fill();
  ctx.translate(0,-(o.air||0));ctx.scale(s*flip*(1+squash*.1),s*(1-squash*.1));ctx.rotate(tilt);
  if(glow>0){const g=ctx.createRadialGradient(0,-250,20,0,-250,420*glow+80);g.addColorStop(0,`rgba(255,250,170,${.7*glow})`);g.addColorStop(1,'rgba(255,230,80,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,-250,520,0,7);ctx.fill();}
  // tail
  P(poly([[50,-95],[120,-160],[92,-188],[190,-268],[158,-294],[268,-402],[302,-360],[222,-272],[248,-250],[150,-164],[178,-140],[80,-66]]),YEL);
  P(poly([[50,-95],[92,-135],[112,-115],[80,-66]]),BRN,8);
  for(const sd of [-1,1]) P(E(sd*56,-16,50,24),YEL);
  P(E(0,-138,108,126),YEL);
  // ears
  for(const sd of [-1,1]){ctx.save();ctx.translate(sd*52,-380);ctx.rotate(sd*(ears*.25));
    const ear=()=>{ctx.moveTo(-sd*14,0);ctx.quadraticCurveTo(sd*70,-80,sd*118,-165);ctx.quadraticCurveTo(sd*80,-70,sd*48,10);ctx.closePath();};
    P(ear,YEL);ctx.save();ctx.beginPath();ear();ctx.clip();ctx.fillStyle='#1d1a18';ctx.beginPath();ctx.arc(sd*118,-165,62,0,7);ctx.fill();ctx.restore();P(ear,null);ctx.restore();}
  P(E(0,-302,138,114),YEL);
  // arms
  for(const sd of [-1,1]){ if(arms==='up') P(E(sd*95,-255,22,44,sd*2.3),YEL); else P(E(sd*70,-172,22,42,-sd*.6),YEL);}
  // eyes
  for(const sd of [-1,1]){const ex=sd*52,ey=-318;
    if(blink>.5){P(()=>{ctx.moveTo(ex-20,ey);ctx.quadraticCurveTo(ex,ey+(expr==='open'?-16:12),ex+20,ey);},null,9);continue;}
    P(E(ex,ey,21,23),'#1d1a18',6);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ex-6,ey-8,8,0,7);ctx.fill();
    if(angry>0){ctx.fillStyle=YEL;ctx.beginPath();ctx.moveTo(ex-32,ey-34);ctx.lineTo(ex+32,ey-34);ctx.lineTo(ex+sd*30,ey-34+34*angry*(sd>0?.2:1));ctx.lineTo(ex-sd*30,ey-34+34*angry*(sd>0?1:.2));ctx.closePath();
      ctx.fill();P(()=>{ctx.moveTo(ex-sd*28,ey-30+30*angry);ctx.lineTo(ex+sd*28,ey-30+8*angry);},null,9);}}
  // cheeks
  for(const sd of [-1,1]){ if(glow>0){ctx.fillStyle=`rgba(255,255,160,${.8*glow})`;ctx.beginPath();ctx.arc(sd*94,-268,44,0,7);ctx.fill();}
    P(E(sd*94,-268,27,25),glow>.2?'#ff6a40':RED,8);}
  ctx.fillStyle='#1d1a18';ctx.beginPath();ctx.ellipse(0,-298,6,4,0,0,7);ctx.fill();
  if(expr==='w'){P(()=>{ctx.moveTo(-26,-282);ctx.quadraticCurveTo(-13,-266,0,-280);ctx.quadraticCurveTo(13,-266,26,-282);},null,7);}
  else {const h=expr==='shout'?62:40;P(()=>{ctx.moveTo(-30,-280);ctx.quadraticCurveTo(0,-280+h*1.7,30,-280);ctx.closePath();},'#9b2c2c',7);
    ctx.save();ctx.clip();ctx.fillStyle='#f29aa6';ctx.beginPath();ctx.ellipse(0,-280+h,22,16,0,0,7);ctx.fill();ctx.restore();}
  ctx.restore();
}
function sparks(x,y,r,n,t,seed,col='#fff36a'){const R=rng(seed+Math.floor(t*20));ctx.strokeStyle=col;ctx.lineWidth=6;
  for(let i=0;i<n;i++){const a=R()*6.28,d=r*(.6+R()*.6);let px=x+Math.cos(a)*r*.4,py=y+Math.sin(a)*r*.4;ctx.beginPath();ctx.moveTo(px,py);
    for(let k=1;k<=3;k++){px=x+Math.cos(a)*d*k/3+(R()-.5)*18;py=y+Math.sin(a)*d*k/3+(R()-.5)*18;ctx.lineTo(px,py);}ctx.stroke();}}

// ---------- the cloud ----------
const PUFF=[[-230,10,105],[-120,-70,130],[15,-105,150],[160,-65,125],[255,15,100],[130,55,120],[-30,65,130],[-175,60,100]];
function cloud(x,y,s,o={}){
  const {mood='grumpy',col='#5b5772',dark='#48445c'}=o;
  ctx.save();ctx.translate(x,y);ctx.scale(s*(1+(o.sq||0)*.12),s*(1-(o.sq||0)*.12));ctx.rotate(o.rot||0);
  ctx.strokeStyle=OL;ctx.lineWidth=22;for(const [a,b,r] of PUFF){ctx.beginPath();ctx.arc(a,b,r,0,7);ctx.stroke();}
  ctx.fillStyle=col;for(const [a,b,r] of PUFF){ctx.beginPath();ctx.arc(a,b,r,0,7);ctx.fill();}
  ctx.fillStyle=dark;ctx.beginPath();ctx.ellipse(0,110,260,40,0,0,7);ctx.save();ctx.clip();ctx.restore();
  ctx.fillStyle='rgba(255,255,255,.18)';for(const [a,b,r] of PUFF.slice(1,4)){ctx.beginPath();ctx.arc(a-r*.25,b-r*.3,r*.45,0,7);ctx.fill();}
  const eye=(sd,f)=>f(sd*72,-20);
  if(mood==='grumpy'||mood==='gulp'){
