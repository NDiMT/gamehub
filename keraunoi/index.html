const G={started:false,mode:'classic',li:0,wi:0,pos:0,word:'',target:'',slotT:-9,round:1,clouds:[],cleared:0,need:6,bolts:[],fx:[],cheer:-9,winT:-99,mega:-99,now:0,hold:null,charge:0,sunK:0,seed:1};
function spawnCloud(i,now){const R=rng(G.seed++*97),big=i===G.need-1&&G.round>=1;const s=(big?1:.42+R()*.18)*(LH>1200?.62:.75);
  const dir=R()<.5?-1:1;return {x:dir>0?-300*s-R()*LW*.6:LW+300*s+R()*LW*.6,y:LH*(.1+R()*.33),s,dir,vx:(70+R()*50+G.round*18)*(big?.6:1),ph:R()*6,hp:big?3:1,big,state:'grumpy',t0:now,hit:-9};}
function newRound(now){G.clouds=[];G.cleared=0;G.need=5+Math.min(G.round,5);for(let i=0;i<G.need;i++)G.clouds.push(spawnCloud(i,now));G.winT=-99;}

const LFONT='Comfortaa,"Arial Rounded MT Bold","Trebuchet MS",Arial,sans-serif';
try{document.fonts.load('700 40px Comfortaa','ΑΒΓ');}catch(e){}
const NAME={'Α':'άλφα','Β':'βήτα','Γ':'γάμμα','Δ':'δέλτα','Ε':'έψιλον','Ζ':'ζήτα','Η':'ήτα','Θ':'θήτα','Ι':'γιώτα','Κ':'κάπα','Λ':'λάμδα','Μ':'μι','Ν':'νι','Ξ':'ξι','Ο':'όμικρον','Π':'πι','Ρ':'ρο','Σ':'σίγμα','Τ':'ταυ','Υ':'ύψιλον','Φ':'φι','Χ':'χι','Ψ':'ψι','Ω':'ωμέγα'};
const ORDER='ΑΜΠΤΟΛΕΣΝΚΙΡΓΔΒΧΦΖΘΗΥΩΞΨ'.split('');
const WORDS=[['ΜΑΜΑ','μαμά','μα, μά'],['ΓΑΤΑ','γάτα','γά, τα'],['ΝΕΡΟ','νερό','νε, ρό'],['ΜΗΛΟ','μήλο','μή, λο'],['ΠΑΠΙΑ','πάπια','πά, πια'],['ΜΠΑΛΑ','μπάλα','μπά, λα'],['ΣΠΙΤΙ','σπίτι','σπί, τι'],['ΜΠΑΜΠΑΣ','μπαμπάς','μπα, μπάς']];
const LS={get(k,d){try{const v=localStorage.getItem('kerauno.'+k);return v==null?d:(+v||0);}catch(e){return d;}},set(k,v){try{localStorage.setItem('kerauno.'+k,String(v));}catch(e){}}};
G.li=LS.get('li',0);G.wi=LS.get('wi',0);
// Recorded female Greek voice (Athina), embedded so every device sounds the same.
const CLIP_SRC=(()=>{try{return JSON.parse(document.getElementById('voice').textContent);}catch(e){return {};}})(),CLIP_BUF={};
async function clipBuf(k){if(CLIP_BUF[k])return CLIP_BUF[k];const b64=CLIP_SRC[k];if(!b64||!AC)return null;
  const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));return CLIP_BUF[k]=await AC.decodeAudioData(bin.buffer);}
function duck(on){if(musicNode&&musicOn)musicNode.gain.value=on?.03:.1;}
let voiceSrc=null,voiceSeq=0;
function stopVoice(){voiceSeq++;if(voiceSrc){try{voiceSrc.stop();}catch(e){}voiceSrc=null;}duck(false);}
async function play(keys,delay=0){stopVoice();const seq=voiceSeq;if(delay)await new Promise(r=>setTimeout(r,delay));
  for(const k of keys){const b=await clipBuf(k).catch(()=>null);if(seq!==voiceSeq)return;if(!b)continue;
    await new Promise(res=>{const src=AC.createBufferSource(),g=AC.createGain();src.buffer=b;g.gain.value=1.5;src.connect(g).connect(master);
      src.onended=()=>{if(voiceSrc===src){voiceSrc=null;duck(false);}res();};voiceSrc=src;duck(true);src.start();});
    if(seq!==voiceSeq)return;}}
const wanted=()=>G.mode==='letters'?G.target:G.word[G.pos];
const spoken=()=>WORDS[G.wi%WORDS.length][1];
function sayPrompt(delay=0){play([G.mode==='words'?'w:'+G.word:'f:'+G.target],delay);}
function newLearnRound(now,delay=600){G.clouds=[];G.cleared=0;G.winT=-99;const R=rng(G.seed++*131);let letters;
  if(G.mode==='letters'){const L=ORDER[G.li%ORDER.length];G.target=L;const pool=ORDER.slice(0,Math.max(6,G.li%ORDER.length+3)).filter(x=>x!==L),d=[];
    while(d.length<3){const x=pool[Math.floor(R()*pool.length)];if(!d.includes(x))d.push(x);}
    letters=[L,L,...d];G.need=2;}
  else{const w=WORDS[G.wi%WORDS.length][0];G.word=w;G.pos=0;letters=w.split('');const pool=ORDER.filter(x=>!w.includes(x));
    for(let i=0;i<(w.length<=4?2:1);i++)letters.push(pool[Math.floor(R()*pool.length)]);G.need=w.length;}
  for(let i=letters.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[letters[i],letters[j]]=[letters[j],letters[i]];}
  const n=letters.length,s=(n>6?.54:.64)*(LH>1200?.62:.55);
  letters.forEach((ch,k)=>G.clouds.push({x:LW*(.12+R()*.76),y:LH*(.19+(k/(n-1))*.27),s,dir:k%2?-1:1,vx:24+R()*22,ph:R()*6,hp:1,big:false,state:'grumpy',t0:now,hit:-9,laugh:-9,letter:ch}));
  sayPrompt(delay);}
function learnHit(c,now){if(!G.started||c.state!=='grumpy'||!G.clouds.includes(c))return;
  if(c.letter!==wanted()){c.laugh=now;sBoing();buzz(15);if(G.mode==='letters')play(['x:'+c.letter,'f:'+wanted()]);return;}
  c.state='nice';c.t0=now;c.hit=now;G.cleared++;G.cheer=now;sPoof(G.cleared);buzz(30);
  G.fx.push({k:'impact',x:c.x,y:c.y,r:150*c.s/.6,t0:now,col:'#ffd83a'});
  if(G.mode==='words'){G.pos++;G.slotT=now;}
  if(G.cleared>=G.need){G.winT=now+.6;setTimeout(()=>sWin(),600);
    if(G.mode==='letters'){play(['n:'+c.letter,'bravo']);G.li++;LS.set('li',G.li);}
    else{play(['w:'+G.word],350);G.wi++;LS.set('wi',G.wi);}}
  else if(G.mode==='letters')play(['n:'+c.letter]);
}
function startMode(m,now){G.started=true;G.mode=m;G.bolts=[];G.fx=[];if(m==='classic'){G.round=1;newRound(now);}else newLearnRound(now,0);sBoing();}
function goHome(){G.started=false;G.clouds=[];G.bolts=[];G.cleared=0;G.winT=-99;stopVoice();}
function kidPos(){return {x:LW*(LW>LH?.3:.27),y:GY};}
function pikaPos(){return {x:LW*(LW>LH?.62:.7),y:GY};}
const KSg=()=>LH>1200?.62:.46, PSg=()=>LH>1200?.56:.42;
function cheek(air=0){const p=pikaPos();return {x:p.x-10,y:GY-air-268*PSg()};}
function cloudAt(x,y){let best=null,bd=1e9;for(const c of G.clouds){if(c.state!=='grumpy')continue;const dx=(x-c.x)/(300*c.s),dy=(y-c.y)/(190*c.s),d=dx*dx+dy*dy;if(d<1.6&&d<bd){bd=d;best=c;}}return best;}
function nearestCloud(big){let best=null,bd=1e9;const p=pikaPos();for(const c of G.clouds){if(c.state!=='grumpy'||c.x<0||c.x>LW)continue;if(big&&!c.big)continue;const d=Math.hypot(c.x-p.x,c.y-p.y);if(d<bd){bd=d;best=c;}}return best;}
function hitCloud(c,dmg,now){c.hp-=dmg;c.hit=now;if(c.hp<=0){c.state='nice';c.t0=now;G.cleared++;G.cheer=now;sPoof(G.cleared);buzz(30);
    G.fx.push({k:'impact',x:c.x,y:c.y,r:150*c.s/.6,t0:now,col:'#ffd83a'});
    if(G.cleared>=G.need){G.winT=now+.6;setTimeout(()=>sWin(),600);}}
  else G.fx.push({k:'impact',x:c.x+120*c.s,y:c.y-80*c.s,r:70,t0:now,col:'#ffb13a'});}
function fire(tx,ty,mega,now){const air=mega?220:0,c0=cheek(air);let c=mega&&G.mode==='classic'?(nearestCloud(true)||nearestCloud(false)):cloudAt(tx,ty);
  const x2=c?c.x:tx,y2=c?c.y+30*c.s:ty;G.bolts.push({x1:c0.x,y1:c0.y,x2,y2,w:mega?40:20,t0:now,dur:mega?.9:.3,seed:(Math.random()*1e6)|0,mega});
  sZap(mega);buzz(mega?120:20);if(mega)G.mega=now;
  if(c)setTimeout(()=>G.mode==='classic'?hitCloud(c,mega?9:1,G.now):learnHit(c,G.now),60);}

let chargeSnd=null;
cv.addEventListener('pointerdown',e=>{e.preventDefault();audioInit();if(AC&&AC.state==='suspended')AC.resume();

  if(chargeSnd){try{chargeSnd.g.gain.value=0;chargeSnd.o.stop();}catch(_){}chargeSnd=null;}
  if(held>=.9) fire(x,y,true,G.now); else fire(x,y,false,G.now); G.hold=null;});
addEventListener('pointercancel',()=>{G.hold=null;if(chargeSnd){try{chargeSnd.o.stop();}catch(_){}chargeSnd=null;}});
function musicBtn(){return {x:LW-70,y:70+ (LH>1200?30:0),r:44};}

function homeBtn(){return {x:70,y:70+(LH>1200?30:0),r:44};}
function hitHome(x,y){const b=homeBtn();return Math.hypot(x-b.x,y-b.y)<b.r+10;}
const bannerY=()=>LH>1200?100:72;
function hitBanner(x,y){return Math.abs(x-LW/2)<260&&y>bannerY()-70&&y<bannerY()+100;}
const MENU=[['classic','ΚΕΡΑΥΝΟΙ','ρίξε κεραυνούς','#ffd83a'],['letters','ΓΡΑΜΜΑΤΑ','βρες το γράμμα','#9fd4ff'],['words','ΛΕΞΕΙΣ','γράψε λέξεις','#ffb8c4']];

// ---------- scene drawing (world scales with the screen) ----------
function sky(storm){const g=ctx.createLinearGradient(0,0,0,GY);g.addColorStop(0,mix('#48b8ff','#3d4258',storm));g.addColorStop(1,mix('#c8ecff','#7b7f92',storm));ctx.fillStyle=g;ctx.fillRect(-50,-50,LW+100,LH+100);}
function hills(storm){
  P(()=>{ctx.moveTo(-60,GY-140);ctx.bezierCurveTo(LW*.2,GY-260,LW*.45,GY-240,LW*.6,GY-170);ctx.bezierCurveTo(LW*.75,GY-110,LW*.9,GY-240,LW+60,GY-200);ctx.lineTo(LW+60,LH+60);ctx.lineTo(-60,LH+60);ctx.closePath();},mix('#8fdc72','#556e5a',storm),10);
  const ts=LH>1200?.8:.7;
  for(const [fx,dy,s] of [[.08,-150,1],[.92,-190,1.1],[.8,-175,.7]]){ctx.save();ctx.translate(LW*fx,GY+dy);ctx.scale(s*ts,s*ts);
    P(()=>ctx.roundRect(-18,-40,36,140,10),mix('#9a6a3e','#5e4a3a',storm),9);
    for(const [a,b,r] of [[-50,-80,60],[45,-90,62],[0,-150,75]]) P(C(a,b,r),mix('#4fb04a','#3d5c42',storm),9);ctx.restore();}
  P(()=>{ctx.moveTo(-60,GY-30);ctx.bezierCurveTo(LW*.3,GY-60,LW*.7,GY-40,LW+60,GY-35);ctx.lineTo(LW+60,LH+60);ctx.lineTo(-60,LH+60);ctx.closePath();},mix('#61c14c','#44654a',storm),10);
  const R=rng(5);for(let i=0;i<Math.floor(LW/14);i++){const x=R()*LW,y=GY+10+R()*(LH-GY-20);const c=['#ff6f91','#fff36a','#ffffff','#b58cff'][i%4];
    ctx.fillStyle=mix(c,'#6a7a70',storm*.7);ctx.beginPath();ctx.arc(x,y,7,0,7);ctx.fill();ctx.fillStyle=mix('#fff36a','#8a8a70',storm);ctx.beginPath();ctx.arc(x,y,3,0,7);ctx.fill();}}
function rain(t,k){if(k<=0)return;const R=rng(9);ctx.strokeStyle=`rgba(210,220,255,${.5*k})`;ctx.lineWidth=3;ctx.beginPath();
  for(let i=0;i<Math.floor(LW/6);i++){const x0=R()*(LW+300)-150,sp=900+R()*400,ph=R();const y=((ph*(LH+200)+t*sp)%(LH+200))-100,x=x0-y*.15;ctx.moveTo(x,y);ctx.lineTo(x-8,y+44);}ctx.stroke();}
function rainbow(k){if(k<=0)return;const cols=['#ff5a5a','#ffa23a','#ffe14a','#6ad86a','#4ab4ff','#8a6aff'],R0=Math.min(LW*.62,LH*.42);ctx.save();ctx.globalAlpha=.8;
  for(let i=0;i<6;i++){ctx.beginPath();ctx.arc(LW/2,GY+40,R0-i*26,Math.PI,Math.PI+Math.PI*k);ctx.lineWidth=28;ctx.strokeStyle=cols[i];ctx.lineCap='butt';ctx.stroke();}ctx.restore();ctx.lineCap='round';}
function playIcon(t){const x=LW/2,y=LH*.42,r=110+Math.sin(t*4)*6;ctx.save();P(C(x,y,r),'#ffd83a',12);P(poly([[x-34,y-52],[x-34,y+52],[x+56,y]]),'#fffdf5',10);

function noteIcon(){const b=musicBtn();ctx.save();ctx.globalAlpha=.9;P(C(b.x,b.y,b.r),'#fffdf5',7);
  P(()=>{ctx.moveTo(b.x-6,b.y+14);ctx.lineTo(b.x-6,b.y-20);ctx.lineTo(b.x+16,b.y-26);ctx.lineTo(b.x+16,b.y+8);},null,6);P(E(b.x-13,b.y+15,9,7),PENCIL,3);P(E(b.x+9,b.y+9,9,7),PENCIL,3);

function menuIcon(id,x,y,k){ctx.save();ctx.translate(x,y);ctx.scale(k,k);

function homeIcon(){const b=homeBtn();ctx.save();ctx.globalAlpha=.9;P(C(b.x,b.y,b.r),'#fffdf5',7);
  P(poly([[b.x-22,b.y-2],[b.x,b.y-22],[b.x+22,b.y-2],[b.x+15,b.y-2],[b.x+15,b.y+20],[b.x-15,b.y+20],[b.x-15,b.y-2]]),'#ffd83a',5);P(()=>ctx.roundRect(b.x-5,b.y+6,10,14,2),PENCIL,3);ctx.restore();}
function speaker(x,y){P(poly([[x-16,y-8],[x-6,y-8],[x+6,y-18],[x+6,y+18],[x-6,y+8],[x-16,y+8]]),'#fffdf5',5);

function wordBanner(t){const w=G.word,n=w.length,sw=Math.min(78,(LW-300)/n),y=bannerY(),x0=LW/2-n*sw/2;ctx.save();

function progressSuns(){const n=G.need,sp=46,x0=LW/2-(n-1)*sp/2,y=LH>1200?80:60;for(let i=0;i<n;i++){const on=i<G.cleared;ctx.save();ctx.globalAlpha=on?1:.45;P(C(x0+i*sp,y,15),on?'#ffd83a':'#fffdf5',5);ctx.restore();}}

// ---------- main loop ----------
let last=performance.now();
function frame(ms){const dt=Math.min(.05,(ms-last)/1000);last=ms;G.now+=dt;const t=G.now;pCount=0;
  ctx.setTransform(SC,0,0,SC,0,0);
  const prog=G.started?G.cleared/G.need:0, win=G.winT>0&&t>G.winT;
  G.sunK=lerp(G.sunK,win?1:prog*.4,dt*2.5);
  const storm=clamp(1-G.sunK*1.25);
  // clouds move
  for(const c of G.clouds){if(c.state==='grumpy'){c.x+=c.dir*c.vx*dt;const m=300*c.s+40;if(c.dir>0&&c.x>LW+m){c.x=-m;}if(c.dir<0&&c.x<-m){c.x=LW+m;}}else{c.y-=dt*90;c.x+=c.dir*dt*30;}}
  // charging
  let charge=0;if(G.hold){charge=clamp((t-G.hold.t-.15)/.75);if(charge>0&&!chargeSnd)chargeSnd=sCharge();}
  const megaAir=G.mega>0?Math.max(0,1-(t-G.mega)/.9):0, air=Math.max(charge*220,megaAir*220);
  sky(storm);
  const sp={x:LW*.78,y:LH*(LH>1200?.17:.2)},ss=(LH>1200?.8:.7)*G.sunK;if(ss>.05)sun(sp.x,sp.y,ss,t);
  rainbow(win?eout(clamp((t-G.winT)/1.5)):0);
  for(const c of G.clouds){if(c.state==='nice'&&c.y<-300)continue;const hurt=t-c.hit<.45,laughing=t-(c.laugh??-9)<.9;
    const mood=c.state==='nice'?'nice':hurt?'hurt':laughing?'laugh':c.letter?'letter':'grumpy';const white=c.state==='nice'?clamp((t-c.t0)/.5):0;
    cloud(c.x,c.y+Math.sin(t*1.6+c.ph)*10,c.s*(c.state==='nice'?lerp(1,.7,white):1),{mood,sq:hurt?Math.sin(t*50)*.35:0,col:mix(c.big?'#48445c':'#5b5772','#ffffff',white),dark:'#48445c',letter:c.letter,lx:(pikaPos().x-c.x)/LW*20});
    if(c.big&&c.state==='grumpy')for(let i=0;i<c.hp;i++){ctx.save();P(C(c.x-30+i*30,c.y-200*c.s,9),'#ff6f7d',4);ctx.restore();}}
  hills(storm);
  // characters
  const kp=kidPos(),pp=pikaPos(),cheerK=clamp(1-(t-G.cheer)/.9),winK=win?1:0;
  const target=nearestCloud(false);const lookX=target?clamp((target.x-kp.x)/LW*2,-1,1):.3;

  if(G.started&&win&&t>G.winT+4.2){if(G.mode==='classic'){G.round++;newRound(t);}else newLearnRound(t);}
