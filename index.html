<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#2a1e5c" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Dream Run</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
  <link rel="icon" href="assets/icons/icon-192.png" />
  <link rel="stylesheet" href="css/style.css" />
  <script type="importmap">
    { "imports": { "three": "./lib/three.module.min.js" } }
  </script>
</head>
<body>
  <div id="game-container"></div>

  <!-- Σκοτεινό vignette όταν πλησιάζει το «ξύπνημα» -->
  <div id="void-vignette"></div>
  <div id="void-warning" class="hidden">ΤΟ ΞΥΠΝΗΜΑ ΠΛΗΣΙΑΖΕΙ!</div>

  <div id="hud" class="hidden">
    <div id="best">BEST 0</div>
    <div id="score">0</div>
    <div id="stars">✦ 0</div>
  </div>

  <div id="loading-screen" class="overlay">
    <div class="moon-loader">☾</div>
    <p>Το όνειρο ετοιμάζεται...</p>
  </div>

  <div id="start-screen" class="overlay hidden">
    <h1>DREAM<br>RUN</h1>
    <p class="subtitle">Το όνειρο καταρρέει.<br>Τρέξε πριν σε προλάβει το ξύπνημα.</p>
    <button id="start-btn">ΟΝΕΙΡΕΨΟΥ</button>
    <div class="controls-help">
      <span>Swipe ←→ λωρίδα</span>
      <span>Swipe ↑ / tap άλμα</span>
      <span>Swipe ↓ κύλισμα</span>
    </div>
  </div>

  <div id="gameover-screen" class="overlay hidden">
    <h1 class="small">ΞΥΠΝΗΣΕΣ</h1>
    <div class="score-panel">
      <div class="score-label">ΣΚΟΡ</div>
      <div id="final-score">0</div>
      <div id="final-best" class="subtitle"></div>
    </div>
    <button id="restart-btn">ΞΑΝΑΚΟΙΜΗΣΟΥ</button>
    <p class="hint">ή tap οπουδήποτε</p>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
