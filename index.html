<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0812" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>CRYPTBOUND: The Shadowkeep</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="lib/peerjs.min.js"></script>
  <script type="importmap">
    { "imports": { "three": "./lib/three.module.min.js" } }
  </script>
</head>
<body>

  <!-- Home -->
  <div id="screen-home" class="screen parchment-bg">
    <div id="embers" class="embers" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="title-block">
      <img id="logo-art" src="assets/art/logo.webp" alt="CRYPTBOUND: The Shadowkeep"
        onerror="this.remove()" onload="this.closest('.title-block').classList.add('has-art')" />
      <div class="title-rule">⚔ ✦ ⚔</div>
      <h1 class="logo">CRYPTBOUND</h1>
      <p class="tagline">— The Shadowkeep —</p>
    </div>
    <p id="loading-note" class="dim">Unpacking the miniatures...</p>
    <div class="home-form">
      <input id="player-name" type="text" maxlength="14" placeholder="Your name" autocomplete="off" />
      <button id="btn-continue" class="primary hidden">⤵ Continue campaign</button>
      <button id="btn-host" class="primary"><img class="btn-px" src="assets/icons/px/host.png" alt="" onerror="this.remove()" /> Host a game</button>
      <div class="join-row">
        <input id="join-code" type="text" maxlength="4" placeholder="CODE" autocomplete="off" />
        <button id="btn-join"><img class="btn-px" src="assets/icons/px/join.png" alt="" onerror="this.remove()" /> Join</button>
      </div>
      <button id="btn-solo" class="ghost"><img class="btn-px" src="assets/icons/px/solo.png" alt="" onerror="this.remove()" /> Solo delve</button>
      <p id="home-error" class="error"></p>
    </div>
    <p class="fine-print">1–4 heroes, each on their own phone · The dungeon plays itself</p>
    <p id="build-badge" class="fine-print" style="position:absolute;bottom:8px;right:12px;opacity:0.4"></p>
  </div>

  <!-- Lobby -->
  <div id="screen-lobby" class="screen parchment-bg">
    <h2 class="lobby-title">Party gathers at room <span id="lobby-code">—</span></h2>
    <p id="lobby-hint" class="dim"></p>
    <div id="lobby-slots"></div>
    <button id="btn-start" class="primary hidden">⚔ BEGIN THE QUEST</button>
  </div>

  <!-- Game -->
  <div id="screen-game" class="screen hidden">
    <div id="board-container"></div>
    <div id="table-vignette"></div>
    <div id="turn-bar"></div>
    <div id="objective-chip"></div>
    <div id="hero-card"></div>
    <button id="btn-center" title="Center on active hero"><img class="btn-px" src="assets/icons/px/center.png" alt="" data-fb="🎯" onerror="this.replaceWith(this.dataset.fb)" /></button>
    <button id="btn-rotate" title="Rotate camera"><img class="btn-px" src="assets/icons/px/rotate.png" alt="" data-fb="↻" onerror="this.replaceWith(this.dataset.fb)" /></button>
    <button id="btn-skip" class="hidden" title="Fast-forward">⏩ Skip</button>
    <div id="game-log"></div>
    <div id="dice-tray" class="hidden"></div>
    <div id="turn-banner" class="hidden"></div>
    <div id="card-overlay" class="hidden"></div>
    <div id="bottom-sheet" class="hidden"></div>
    <div id="action-bar"></div>
  </div>

  <!-- End -->
  <div id="screen-end" class="screen parchment-bg">
    <div class="embers" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    <h1 id="end-title"></h1>
    <p id="end-text"></p>
    <div id="end-stats"></div>
    <button id="btn-again" class="primary">↺ Play again</button>
  </div>

  <!-- Armory (μεταξύ των quests της καμπάνιας — ο host ψωνίζει για όλους) -->
  <div id="screen-armory" class="screen parchment-bg hidden">
    <h2 class="lobby-title">⚒ The Wayfarers' Armory</h2>
    <p id="armory-interlude"></p>
    <div id="armory-tabs"></div>
    <div id="armory-items"></div>
    <button id="btn-descend" class="primary">⬇ Descend</button>
  </div>

  <div id="toast" class="hidden"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
