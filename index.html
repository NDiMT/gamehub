<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#14101e" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>CRYPTBOUND: The Shadowkeep</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="lib/peerjs.min.js"></script>
  <script type="importmap">
    { "imports": { "three": "./lib/three.module.min.js" } }
  </script>
</head>
<body>

  <!-- Αρχική -->
  <div id="screen-home" class="screen">
    <h1 class="logo">CRYPTBOUND</h1>
    <p class="tagline">The Shadowkeep</p>
    <p id="loading-note">Φορτώνονται οι μινιατούρες...</p>
    <div class="home-form">
      <input id="player-name" type="text" maxlength="14" placeholder="Το όνομά σου" autocomplete="off" />
      <button id="btn-host" class="primary">➕ Δημιουργία παιχνιδιού</button>
      <div class="join-row">
        <input id="join-code" type="text" maxlength="4" placeholder="ΚΩΔΙΚΟΣ" autocomplete="off" />
        <button id="btn-join">Σύνδεση</button>
      </div>
      <button id="btn-solo" class="ghost">🗡 Σόλο εξερεύνηση</button>
      <p id="home-error" class="error"></p>
    </div>
  </div>

  <!-- Lobby -->
  <div id="screen-lobby" class="screen hidden">
    <h2>Δωμάτιο <span id="lobby-code">—</span></h2>
    <p id="lobby-hint" class="dim"></p>
    <div id="lobby-slots"></div>
    <button id="btn-start" class="primary hidden">▶ ΕΝΑΡΞΗ ΑΠΟΣΤΟΛΗΣ</button>
  </div>

  <!-- Παιχνίδι -->
  <div id="screen-game" class="screen hidden">
    <div id="board-container"></div>
    <div id="turn-bar"></div>
    <div id="hero-card"></div>
    <div id="game-log"></div>
    <div id="dice-overlay" class="hidden"></div>
    <div id="action-bar"></div>
  </div>

  <!-- Τέλος -->
  <div id="screen-end" class="screen hidden">
    <h1 id="end-title"></h1>
    <p id="end-text"></p>
    <button id="btn-again" class="primary">↺ Ξανά</button>
  </div>

  <div id="toast" class="hidden"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
